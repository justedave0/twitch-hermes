name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest "fastapi>=0.110" "httpx>=0.27,<1" "websockets>=12,<16"
      - name: Run test suite
        run: python -m pytest tests/ -q
